[project]
name = "sandcastle-backend"
version = "0.1.0"
description = "Sandcastle story and canon service"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "python-dotenv",
]

[tool.setuptools]
packages = ["app"]