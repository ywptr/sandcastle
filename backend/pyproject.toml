[project]
name = "sandcastle-backend"
version = "0.1.0"
description = "Sandcastle story and canon service"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "langdetect==1.0.9",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "python-dotenv",
    "httpx",
    "itsdangerous",
    "PyJWT[crypto]>=2.15.1,<3",
    "openai",
    "cryptography>=46,<49",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.creative_direction" = ["styles.json"]
