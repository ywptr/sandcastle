*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,'Segoe UI',Arial,sans-serif;background:#faf8fd;color:var(--ink);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ae83f3;outline-offset:2px}a{color:var(--purple);text-decoration:none}a:hover{text-decoration:underline}
#app{min-height:100vh}header{height:68px;display:flex;align-items:center;gap:17px;padding:0 25px 0 21px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:8;box-shadow:0 1px 6px #2c17460a}.brand{display:flex;gap:10px;align-items:center;font-size:19px;font-weight:850;letter-spacing:-.6px;white-space:nowrap}.brand-mark{width:35px;height:37px;display:grid;place-items:center;background:linear-gradient(140deg,#bd8cff,#6c25d1);color:#fff;border-radius:10px 10px 6px 6px;box-shadow:0 4px 10px #5720c32d}.brand-mark svg{width:25px;height:25px}.studio-tag{font-size:10px;color:#6234aa;background:#ece1ff;border-radius:30px;padding:5px 10px;letter-spacing:0}.head-center{margin:auto;color:#7131c5;font-weight:750;white-space:nowrap;font-size:13px}.head-right{display:flex;align-items:center;gap:9px}.top-btn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 10px;font-size:11px;font-weight:700;color:#574966;display:flex;align-items:center;gap:6px}.top-btn:hover,.btn-secondary:hover{border-color:#c9abf0;background:#faf6ff}.round-icon{width:34px;height:34px;border:none;background:transparent;color:#6f5c81;border-radius:10px;display:grid;place-items:center}.round-icon:hover{background:var(--lav)}.avatar{width:34px;height:34px;display:grid;place-items:center;border:0;background:linear-gradient(125deg,#a95cff,#6226bc);color:#fff;border-radius:50%;font-size:13px;font-weight:800}.lang-pop{position:absolute;right:190px;top:60px;min-width:224px;border:1px solid var(--line);background:#fff;padding:8px;border-radius:13px;box-shadow:0 10px 35px #3824522c;z-index:30}.lang-option{display:flex;justify-content:space-between;width:100%;background:none;border:0;text-align:left;padding:10px;border-radius:8px;font-size:12px}.lang-option:hover{background:var(--lav)}
.layout{display:grid;grid-template-columns:206px minmax(0,1fr);min-height:calc(100vh - 68px)}.sidebar{background:linear-gradient(180deg,#fff 0%,#fff 76%,#f1e8ff 100%);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}.button,.btn-primary,.btn-secondary,.btn-tertiary{border-radius:10px;padding:10px 14px;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1.2}.btn-primary{border:1px solid #7430d2;background:linear-gradient(100deg,#8c3df0,#6525ca);color:#fff;box-shadow:0 3px 8px #7e38d52a}.btn-primary:hover{filter:brightness(1.04)}.btn-secondary{border:1px solid #dac9ec;background:white;color:#6937b2}.btn-tertiary{border:0;color:#713dbb;background:#f5edff}.btn-icon{border:1px solid var(--line);background:white;padding:8px;border-radius:9px;display:inline-grid;place-items:center}.new-button{width:100%;height:43px;margin-bottom:20px;font-size:12px}.sidebar-nav{display:flex;flex-direction:column;gap:2px}.navitem{width:100%;border:0;background:none;color:#51435f;border-radius:9px;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;font-size:12px;font-weight:675}.navitem svg{flex:0 0 18px;color:#6c607d}.navitem.active{background:#f0e5ff;color:#6a2ac1}.navitem.active svg{color:#7229cf}.navitem:hover{background:#f8f3ff}.sidediv{height:1px;background:#e6def0;margin:15px 6px}.sidebar-spacer{flex:1;min-height:24px}.side-small{font-size:10px;color:#9689a8;line-height:1.6;padding:11px}.side-ornament{font-size:64px;color:#bb93ed;text-align:center;opacity:.5;line-height:1.1;margin-bottom:0}
main{min-width:0;padding:22px clamp(18px,2vw,30px) 34px;max-height:calc(100vh - 68px);overflow:auto}.container{max-width:1500px;margin:0 auto}.breadcrumb{font-size:11px;color:#9d8fae;font-weight:700;display:flex;gap:7px;align-items:center;margin-bottom:12px}.breadcrumb strong{color:var(--purple)}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:3px 0 18px}.pagehead h1{margin:0;font-size:26px;letter-spacing:-1px;line-height:1.2}.pagehead p{color:#877b94;margin:6px 0 0;font-size:12px}.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.panel{min-width:0}.panel.pad{padding:18px}.card{padding:16px}.muted{color:var(--muted)}.text-xs{font-size:11px}.text-sm{font-size:12px}.subtle{font-size:11px;color:#91859e}.cap{font-size:10px;font-weight:850;letter-spacing:.9px;text-transform:uppercase;color:#88729f}.top-space{margin-top:18px}.spacer{flex:1}.hstack{display:flex;align-items:center;gap:10px}.hstack.wrap{flex-wrap:wrap}.vstack{display:flex;flex-direction:column;gap:10px}.divider{height:1px;background:var(--line);margin:14px 0}.chip,.tag,.mini-badge{font-size:10px;display:inline-flex;align-items:center;gap:4px;font-weight:800;border-radius:40px;padding:5px 8px;background:#f1e8fe;color:#7133bc;white-space:nowrap}.tag.weak{color:#71667d;background:#f5f2f8}.tag.green{background:#e9f8f1;color:#167b5f}.tag.orange{background:#fff5e5;color:#9d661a}.tag.blue{background:#e9f2ff;color:#4674b9}.sep{width:1px;height:18px;background:#e6ddec}.row-between{display:flex;justify-content:space-between;gap:12px;align-items:center}.section-label{font-size:14px;font-weight:800;letter-spacing:-.3px;margin:0 0 13px}.field-label{display:block;color:#6f627e;font-weight:750;font-size:11px;margin-bottom:6px}.form-input,.form-select,.form-area{width:100%;border:1px solid #e5daf0;border-radius:10px;background:#fff;color:#312445;padding:10px 11px;font-size:12px}.form-area{min-height:84px;resize:vertical}.form-select{padding-right:30px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-wrap{margin:9px 0}.caution{border:1px solid #f2e1be;background:#fffbf2;color:#896228;padding:10px 12px;border-radius:10px;font-size:11px;line-height:1.55}.info{border:1px solid #e5d5fa;background:#f9f4ff;color:#7656a1;padding:11px 13px;border-radius:12px;line-height:1.55;font-size:11px}.inline-link{background:none;border:0;color:#6d2acb;font-size:11px;font-weight:800;padding:0}.empty-state{padding:30px;text-align:center;color:#81738e;font-size:12px}.displaynone{display:none!important}

function b(txt,act,klass='btn-secondary',extra=''){return `<button class="${klass}" data-act="${act}" ${extra}>${txt}</button>`}

function chrome(content){return `<header><button class="round-icon menuToggle displaynone" data-act="toggle-nav" aria-label="Menu">${I('menu')}</button><div class="brand"><span class="brand-mark">${I('layers',25)}</span>Sandcastle <span class="studio-tag">Studio</span></div><div class="head-center">Where Stories Become Series ✨</div><div class="head-right"><button class="top-btn allowance" data-nav="billing">${I('layers',13)} ${state.demoAllowance[state.selectedFormat]} ${t(fmtLabel[state.selectedFormat])} · ${t('My Plan')}</button><button class="top-btn" data-act="lang-menu">${I('globe',14)} ${state.uiLang==='en'?'EN':'ID'} ${I('chevron',12)}</button><button class="round-icon" data-act="feedback" title="Feedback">${I('message')}</button><button class="avatar" data-nav="settings">S</button></div>${state.langOpen?`<div class="lang-pop"><div class="cap" style="padding:8px">${t('UI Language')}</div><button class="lang-option" data-lang="en">English ${state.uiLang==='en'?'✓':''}</button><button class="lang-option" data-lang="id">Bahasa Indonesia ${state.uiLang==='id'?'✓':''}</button><div class="subtle" style="padding:8px">${state.uiLang==='id'?'Bahasa antarmuka tidak mengubah bahasa ceritamu.':'UI language does not change your story language.'}</div></div>`:''}</header><div class="layout"><aside class="sidebar ${state.mobileNav?'open':''}">${b(`${I('plus')} ${t('Create Series')}`,'go-home','btn-primary new-button')}<div class="sidebar-nav">${navItem('home','Home','home')}${navItem('series','My Series','layers')}${navItem('workspace','Story Workspace','message')}${navItem('editor','Episode Editor','film')}${navItem('characters','Characters','users')}${navItem('world','Story World','globe')}${navItem('library','Library','image')}${navItem('templates','Templates','grid')}</div><div class="sidediv"></div><div class="sidebar-nav">${navItem('export','Export','download')}${navItem('publish','Publish & Schedule','calendar')}${navItem('billing','Plan & Billing','wallet')}${navIt function home(){return `${crumbs('Home')}<div class="homegrid"><div><div class="home-hero"><div class="cap" style="color:#8446c7">CREATE • DEVELOP • PRODUCE</div><h1>${state.uiLang==='id'?'Buat series cerita berikutnya':'Create your next story series'}</h1><p>${state.uiLang==='id'?'Mulai dari satu ide. Ubah menjadi series teks, webtoon, drama pendek, atau story reels.':'Start with one idea. Turn it into a text series, webtoon, short drama, or story reels.'}</p></div><div class="welcome-speech"><div class="bot">${I('spark',19)}</div><div><strong>${state.uiLang==='id'?'Ceritakan idemu dengan gayamu sendiri.':'Tell your story idea in your own words.'}</strong><p>${state.uiLang==='id'?'Mulai dari satu kalimat juga boleh; AI membantu membentuk seri dan episode.':'One sentence is enough. AI helps develop a world, characters, and episodes.'}</p></div></div>${langBanner()}<h3 class="section-label top-space">${state.uiLang==='id'?'Pilih format pertama':'Choose your first format'}</h3>${formatCards()}<div class="top-space"><div class="row-between"><h3 class="section-label">${state.uiLang==='id'?'Butuh inspirasi?':'Need inspiration?'}</h3><button class="inline-link" data-nav="templates">${t('See all')} ${I('arrow',12)}</button></div><div class="ideas"><button class="idea" data-idea="romance"><div class="idea-img">Campus Romance</div><p>A secret changes two students’ lives.</p></button><button class="idea" data-idea="fantasy"><div class="idea-img">Fantasy Adventure</div><p>A young heir discovers a hidden realm.</p></button><button class="idea" data-idea="mystery"><div class="idea-img">Mystery Thriller</div><p>A reporter discovers her own past.</p></button></div></div><div class="home-compose"><label class="field-label">${state.uiLang==='id'?'Ide series kamu':'Your story idea'}</label><textarea id="home-idea" placeholder="${state.uiLang==='id'?'Tulis ide dalam bahasa apa pun…':'Type an idea in any language…'}">${esc(state.storyIdea)}</textarea><div class="home-compose-bottom"><span class="subtle">${I('globe',13)} ${state.uiLang==='id'?'Bahasa output: mengikuti pesan':'Output language: follows your message'}</span>${b(`${t('Create Series')} ${I('arrow',14)}`,'create-series','btn-primary')}</div></div></div><div>${setupPanel(false)}<div class="panel pad top-space"><h3 class="section-label">${state.uiLang==='id'?'Cara kerjanya':'How it works'}</h3><div class="progressrail"><div class="step done"><span class="stepmark">1</span>Describe your story idea</div><div class="step"><span class="stepmark">2</span>Approve a creative style</div><div class="step"><span class="stepmark">3</span>Create your series outline</div><div class="step"><span class="stepmark">4</span>Produce & review episodes</div></div><div class="divider"></div><p class="small-text">${state.uiLang==='id'?'Pengaturan style tidak perlu dipilih satu per satu. AI bisa memberi rekomendasi.':'No need to configure every detail: AI can recommend a creative direction.'}</p></div></div></div>`}
function currentSeries(){return [...(state.customSeries||[]),...sampleSeries].find(s=>s.id===state.selectedSeries)||sampleSeries[0]}
function seriesCards(){const coll=[...(state.customSeries||[]),...sampleSeries].filter(s=>(state.seriesFilter==='All'||s.status===state.seriesFilter)&&s.name.toLowerCase().includes((state.seriesSearch||'').toLowerCase()));return coll.length?`<div class="series-grid">${coll.map(s=>`<button class="seriescard" data-series="${esc(s.id)}"><div class="seriescover cover${s.cover||1}"><span class="tag" style="position:absolute;top:12px;right:12px;background:#ffffffef">${t(s.status)}</span><strong style="font-size:16px;line-height:1.25">${esc(s.name)}</strong></div><div class="seriesbody"><strong>${esc(s.name)}</strong><p>${esc(s.genre)} · ${t(fmtLabel[s.format]||'Webtoon Series')}</p><div class="row-between" style="margin-bottom:7px"><span class="subtle">${s.episodes} / ${s.total} episodes</span><span class="subtle">${s.progress}%</span></div><div class="progressbar"><div style="width:${s.progress}%"></div></div></div></button>`).join('')}</div>`:`<div class="empty-state">${t('No results')} · Try a different filter.</div>`}
function series(){const s=currentSeries();return `${phead('My Series',state.uiLang==='id'?'Semua cerita, format adaptasi, dan episode dalam satu tempat.':'Manage original stories, format adaptations, and episodes in one place.',b(`${I('plus',13)} ${t('Create Series')}`,'go-home','btn-primary'))}<div class="row-between" style="margin-bottom:14px;gap:13px;flex-wrap:wrap"><div class="segmented">${['All','In progress','Draft','Completed'].map(x=>`<button data-filter="${x}" class="${state.seriesFilter===x?'active':''}">${t(x)}</button>`).join('')}</div><div class="search" style="min-width:215px">${I('search',16)}<input id="series-search" value="${esc(state.seriesSearch)}" placeholder="${t('Search series…')}"></div></div>${seriesCards()}<div class="panel pad top-space"><div class="row-between"><div><h3 class="section-label" style="margin-bottom:4px">${esc(s.name)}</h3><p class="subtle">One original story · multiple format adaptations · independent episode allowances</p></div>${b(`${I('plus',13)} ${t('Create Adaptation')}`,'adaptation-modal')}</div><div class="three-col top-space">${['text','webtoon','short'].map((f,i)=>`<button class="card" style="text-align:left;cursor:pointer" data-adaptation="${f}"><div class="hstack">${I(fmtIcon[f],19)} <strong style="font-size:12px">${t(fmtLabel[f])}</strong></div><p class="small-text">${(f==='text'?'Chapter adaptation':f==='webtoon'?'Panel-based episodes':'Vertical 30–60 second clips')}</p><span class="tag ${i===1?'green':''}">${i===1?'18 episodes':'Not started'}</span></button>`).join('')}</div><div class="hstack wrap top-space">${b(`${I('message',14)} ${t('Story Workspace')}`,'go-workspace','btn-primary')}${b(`${I('film',14)} ${t('Episode Editor')}`,'go-editor')}${b(`${I('download',14)} ${t('Export')}`,'go-export')}</div></div>`}
function chatReply(text){const clean=text.trim();if(!clean)return;const lang=state.storyLang==='auto'?detectLanguage(clean):state.storyLang;state.lastMessageLang=lang;state.messages.push({role:'user',text:clean,lang});const messages={en:'I understand. I can help expand this into a consistent series with characters, episode beats, and a style that suits your idea. Choose the next step or refine the premise.',id:'Saya mengerti. Saya bisa membantu mengembangkan ide ini menjadi series yang konsisten, mulai dari karakter, alur episode, hingga gaya bercerita. Pilih langkah berikutnya atau perbaiki premisnya.',es:'Entiendo. Podemos desarrollar esta idea como una serie coherente, con personajes, episodios y un estilo narrativo adecuado.',fr:'Je comprends. Nous pouvons développer cette idée en série cohérente, avec des personnages, des épisodes et une direction créative adaptée.',th:'เข้าใจแล้ว เราสามารถพัฒนาแนวคิดนี้เป็นซีรีส์ที่มีตัวละครและเรื่องราวต่อเนื่องกันได้',hi:'समझ गया। हम इस विचार को पात्रों और एपिसोड के साथ एक सुसंगत श्रृंखला में विकसित कर सकते हैं।',ar:'فهمت. يمكننا تطوير هذه الفكرة إلى سلسلة متماسكة مع شخصيات وحلقات وأسلوب سرد مناسب.',ja:'分かりました。このアイデアを、登場人物とエピソードの一貫性を保ったシリーズに育てましょう。',ko:'이해했어요. 이 아이디어를 캐릭터와 에피소드의 연속성을 유지하는 시리즈로 발전시킬 수 있어요.',zh:'明白了。我们可以将这个想法发展为人物与情节连贯的系列作品。'};state.messages.push({role:'assistant',text:messages[lang]||messages.en,lang});save();render();requestAnimationFrame(()=>{const log=document.querySelector('.chatlog');if(log)log.scrollTop=log.scrollHeight;});}
function detectLanguage(v){if(/[\u0600-\u06ff]/.test(v))return 'ar';if(/[\u0E00-\u0E7F]/.test(v))return 'th';if(/[\u0900-\u097F]/.test(v))return 'hi';if(/[\u3040-\u30ff]/.test(v))return 'ja';if(/[\uac00-\ud7af]/.test(v))return 'ko';if(/[\u4E00-\u9FFF]/.test(v))return 'zh';if(/\b(hola|quiero|historia|crear|por favor|personajes|serie)\b/i.test(v))return 'es';if(/\b(bonjour|histoire|je veux|personnages|épisode|créer)\b/i.test(v))return 'fr';if(/\b(saya|aku|ingin|cerita|tolong|buatkan|dengan|dan|bagaimana|tokoh|yang|karena|episode|bisa)\b/i.test(v))return 'id';return 'en'}
function langName(x){return ({auto:'Auto · follows your message',en:'English',id:'Indonesian',es:'Spanish',fr:'French',th:'Thai',hi:'Hindi',ar:'Arabic',ja:'Japanese',ko:'Korean',zh:'Chinese'})[x]||'English'}
function chatBox(){return `<div class="panel chatpanel"><div class="chathead"><div><strong>${I('spark',15)} Story Assistant</strong><div class="subtle">AI-guided storytelling · ${t('Concept prototype')}</div></div><span class="tag weak">${I('globe',12)} ${t('Auto · follows your message')}</span></div><div class="chatlog" id="chatlog"><div class="hintbar" style="margin-bottom:14px">${I('globe',16)}<div><strong>${state.uiLang==='id'?'Bebas tulis dalam bahasa apa pun.':'Write in any language.'}</strong><br>${state.uiLang==='id'?'AI dirancang membalas dan membuat konten sesuai bahasa pesanmu. UI bisa tetap English atau Indonesia.':'AI is designed to reply and create story content in your message language. UI can remain in English or Indonesian.'}</div></div>${state.messages.map(m=>`<div class="chat-msg ${m.role==='user'?'user':'assistant'}">${m.role==='assistant'?`<span class="bot">${I('spark',15)}</span>`:''}<div class="chat-bubble"><small>${m.role==='user'?'YOU':'SANDCASTLE AI'} · ${langName(m.lang)}</small>${esc(m.text)}</div></div>`).join('')}<div class="hintbar" style="margin-top:16px">${I('spark',15)} <div><strong>${t('AI recommendations for this story')}: ${esc(style().name)}</strong><br>${esc(style().desc)} <button class="inline-link" data-act="open-styles">${t('Change Style')} ${I('arrow',12)}</button></div></div><div class="suggested"><button data-suggest="premise">✦ Develop premise</button><button data-suggest="characters">${I('users',12)} Build characters</button><button data-suggest="outline">${I('layers',12)} Plan episodes</button><button data-act="open-styles">${I('spark',12)} Creative style</button></div></div><div class="chatbottom"><div class="subtle" style="margin-bottom:8px">${I('globe',12)} ${state.uiLang==='id'?'Hasil: mengikuti bahasa pesan':'Output: follows your message'} ${state.storyLang!=='auto'?'· Locked to '+langName(state.storyLang):''}</div><div class="chatinputrow"><textarea id="chat-input" placeholder="${state.uiLang==='id'?'Tulis pesan dalam bahasa apa pun…':'Message Sandcastle in any language…'}"></textarea><button class="chat-send" data-act="send-chat" title="Send">${I('send',17)}</button></div></div></div>`}
function workspace(){const switcher=`<div class="segmented"><button class="${state.workspaceMode==='chat'?'active':''}" data-mode="chat">${I('message',13)} ${t('Chat View')}</button><button class="${state.workspaceMode==='split'?'active':''}" data-mode="split">${I('grid',13)} ${t('Split Workspace')}</button></div>`;return `${phead('Story Workspace',esc(state.seriesTitle)+' · Romance / Drama',switcher)}${state.workspaceMode==='chat'?`<div class="workspacegrid">${chatBox()}${setupPanel(true)}</div>`:`<div class="workspacegrid split"><div class="panel tree-panel"><div class="series-identity"><img class="cover-small" src="${ART}" alt=""><div><h3>${esc(state.seriesTitle)}</h3><p>${t('Series Bible')}</p></div></div><div class="tree-group">STORY BIBLE</div><button class="tree-item active" data-nav="workspace">${I('file',13)} Premise & Plot</button><button class="tree-item" data-nav="characters">${I('users',13)} Characters</button><button class="tree-item" data-nav="world">${I('globe',13)} World & Canon</button><button class="tree-item" data-act="open-styles">${I('spark',13)} ${t('Creative Direction')}</button><div class="tree-group">EPISODES</div>${[1,2,3,4,5,6].map((x)=>`<button class="tree-item ${state.episode===x?'active':''}" data-episode="${x}">Episode ${x} ${x<3?'✓':''}</button>`).join('')}<div class="divider"></div>${b(t('Create Episode'),'new-episode','btn-secondary','style="width:100%"')}</div>${chatBox()}<div class="panel outputpanel"><div class="row-between"><h3 class="section-label">${t('Output')} · Episode ${state.episode}</h3><button class="inline-link" data-nav="editor">${t('Episode Editor')} ${I('arrow',12)}</button></div><img src="${ART}" style="width:100%;height:150px;object-fit:cover;border-radius:11px" alt="Creative preview"><div class="top-space"><strong>Episode ${state.episode} — Getting Closer</strong><p class="small-text">A handwritten note forces Mina to reconsider the agreement. Daniel's answer raises more questions than it resolves.</p><div class="story-beats"><div class="beat"><span class="beatno">1</span><div>Opening hook: Mina discovers a confidential message in the contract.</div></div><div class="beat"><span class="beatno">2</span><div>Emotional confrontation: Daniel refuses to explain the hidden addendum.</div></div><div class="beat"><span class="beatno">3</span><div>Cliffhanger: someone recognizes Mina's real surname.</div></div></div>${b(`${I('film',13)} ${t('Episode Editor')}`,'go-editor','btn-primary')}</div></div></div>`}`}
function characters(){return `${phead('Characters',state.uiLang==='id'?'Karakter yang digunakan ulang di semua format dan episode.':'Reusable character references for every format and episode.',b(`${I('plus',14)} ${t('New Character')}`,'new-character','btn-primary'))}<div class="three-col">${(state.characters||[]).map((c,i)=>`<div class="card"><div class="character-card"><div class="character-avatar ${esc(c.avatar||'')}" aria-hidden="true"></div><div><strong>${esc(c.name)}</strong><div class="tag" style="margin:6px 0">${esc(c.role)}</div><p class="small-text" style="margin:4px 0">${esc(c.trait)}</p></div></div><div class="divider"></div><div class="subtle">${esc(c.appearance)}</div><div class="hstack top-space"><button class="inline-link" data-edit-character="${c.id}">${I('edit',12)} ${t('Edit')}</button><span class="sep"></span><button class="inline-link" data-nav="editor">Use in episode ${I('arrow',12)}</button></div></div>`).join('')}<button class="card" data-act="new-character" style="min-height:193px;border-style:dashed;display:grid;place-items:center;color:#7b40c7;text-align:center"><span>${I('plus',24)}<br>${t('New Character')}<br><small class="subtle">Capture traits & appearance</small></span></button></div><div class="info top-space">${I('shield',16)} Character appearances and relationships are part of the Series Bible. Generated images/videos should reference approved character assets; this prototype does not perform face-consistency checks.</div>`}
function world(){return `${phead('Story World',state.uiLang==='id'?'Simpan aturan dunia, lokasi, relasi, dan fakta agar episode tetap konsisten.':'Keep settings, rules, relationships and timeline facts consistent across episodes.',b(`${I('plus',13)} ${t('Add Note')}`,'add-world','btn-primary'))}<div class="two-col"><div class="panel pad"><h3 class="section-label">${I('globe',16)} World Overview</h3><p class="small-text">A contemporary romance with a contract at the center of a corporate family mystery. The story unfolds in a modern city with recurring office, apartment, and public-gala locations.</p><div class="setting-list"><div class="setting-line"><span>${t('Cultural Setting')}</span><strong class="value">${esc(state.culture)}</strong></div><div class="setting-line"><span>${t('Historical Era')}</span><strong class="value">${esc(state.era)}</strong></div><div class="setting-line"><span>${t('Audience')}</span><strong class="value">${esc(state.audience)}</strong></div><div class="setting-line"><span>${t('Storytelling Style')}</span><strong class="value">${esc(style().name)}</strong></div></div><div class="hstack top-space">${b(`${I('spark',13)} ${t('Creative Direction')}`,'open-styles')}</div></div><div class="panel pad"><h3 class="section-label">${I('history',16)} Canon & Timeline</h3><div class="story-beats"><div class="beat"><span class="beatno">1</span><div><strong>Episode 1</strong><br>Mina and Daniel sign the initial agreement.</div></div><div class="beat"><span class="beatno">2</span><div><strong>Episode 2</strong><br>They meet Daniel's family at a charity gala.</div></div><div class="beat"><span class="beatno">3</span><div><strong>Episode 3</strong><br>Mina finds a hidden addendum. The secret remains unresolved.</div></div></div><div class="info">New scenes should not contradict previously approved series events. This is a design goal, not an implemented validation service.</div></div></div><h3 class="section-label top-space">Saved World Notes</h3><div class="three-col">${(state.worldNotes||[]).map(n=>`<div class="card"><span class="tag">${esc(n.type)}</span><h3 style="font-size:13px">${esc(n.title)}</h3><p class="small-text">${esc(n.body)}</p></div>`).join('')}</div>`}
function editorPreview(){const ep=state.episode;if(state.editorTab==='webtoon')return `<div class="panelstrip">${['“This changes everything.”','“You promised me the truth.”','“Then why is her name here?”','“There is more you need to know.”'].map((v,i)=>`<div class="webtoonpanel"><span class="panel-number">${i+1}</span><div class="bubble">${esc(v)}</div></div>`).join('')}</div>`;if(state.editorTab==='script')return `<div class="script-preview">EPISODE ${ep} — GETTING CLOSER\n\nINT. OFFICE — EVENING\n\nA rainstorm rattles the windows. MINA studies an unsigned addendum.\n\nMINA\nYou knew about this contract. All along.\n\nDANIEL\nI wanted to explain, but my family—\n\nMINA\nNo. You had every chance.\n\nDaniel steps toward her, but Mina closes the file. Her phone lights up with a text: “Ask him about your father.”\n\nCUT TO BLACK.\n\n[Cliffhanger — to be reviewed]</div>`;if(state.editorTab==='short')return `<div class="panel" style="padding:13px"><div class="preview-frame" style="height:330px;max-width:200px;margin:auto;aspect-ratio:9/16"><strong>▶ Vertical short-drama storyboard<br><small>30–60 sec · illustrative</small></strong></div><div class="info top-space">Video production is not connected. This view illustrates shot planning and consistent visual direction.</div></div>`;return `<div class="panel" style="padding:14px"><div class="preview-frame" style="height:320px;max-width:250px;margin:auto;aspect-ratio:9/16"><strong>Story Reels — Text-led scene<br>“Some promises are written in secrets.”</strong></div><div class="info top-space">Illustrative Reel frame; video/audio generation not connected.</div></div>`}
function editor(){return `${phead('Episode Editor',esc(state.seriesTitle)+' · Episode '+state.episode,`${b(`${I('message',13)} ${t('Story Workspace')}`,'go-workspace')}${b(`${I('spark',13)} ${t('Generate')}`,'generate-preview','btn-primary')}`)}<div class="editor-grid"><div class="panel editor-left"><div class="section-label">${t('Episodes')}</div>${[1,2,3,4,5,6].map(x=>`<button class="episode-btn ${state.episode===x?'active':''}" data-episode="${x}"><span class="epnum">${x}</span><span>Ep. ${x}<br><small class="subtle">${x<3?'Completed':x===3?'In review':'Planned'}</small></span></button>`).join('')}<div class="divider"></div>${b(`${I('plus',13)} ${t('Create Episode')}`,'new-episode','btn-secondary','style="width:100%"')}</div><div class="panel editor-main"><div class="row-between"><div><h3 class="section-label" style="margin-bottom:3px">Episode ${state.episode} — Getting Closer</h3><div class="subtle">${t('Storytelling Style')}: ${esc(style().name)} · ${esc(state.audience)}</div></div><span class="tag orange">In review</span></div><div class="preview-toolbar top-space"><div class="segmented">${['webtoon','script','short','reels'].map(k=>`<button class="${state.editorTab===k?'active':''}" data-editor-tab="${k}">${k==='webtoon'?'Webtoon':k==='script'?t('Script'):k==='short'?'Video':t('Story Reels')}</button>`).join('')}</div><span class="spacer"></span>${b(`${I('edit',13)} ${t('Save Draft')}`,'save-draft')}</div><div style="max-height:520px;overflow:auto">${editorPreview()}</div><div class="hstack wrap top-space">${b(`${I('spark',13)} Revise with AI`,'revise-preview','btn-primary')}${b(`${I('shield',13)} ${t('Continuity')}`,'continuity-details')}${b(`${I('message',13)} ${t('Feedback')}`,'feedback')}</div></div><div class="panel editor-right"><h3 class="section-label">${t('Production Settings')}</h3><div class="setting-list"><div class="setting-line"><span>${t('Storytelling Style')}</span><strong class="value">${esc(style().name)}</strong></div><div class="setting-line"><span>${t('Visual Style')}</span><strong class="value">${esc(state.visualStyle)}</strong></div><div class="setting-line"><span>${t('Audience')}</span><strong class="value">${esc(state.audience)}</strong></div><div class="setting-line"><span>${t('Output Language')}</span><strong class="value">${langName(state.storyLang)}</strong></div></div><div class="top-space">${b(`${I('spark',13)} ${t('Change Style')}`,'open-styles')}</div><div class="divider"></div><h3 class="section-label">${t('Continuity')}</h3>${['Characters follow approved references','World / timeline facts preserved','Audience rating policy','Style instructions applied'].map(v=>`<div class="conti-row"><span class="good">${I('check',15)}</span><span>${v}</span></div>`).join('')}<div class="subtle">Mock indicators; actual scoring not connected.</div><div class="divider"></div><div class="usagebar"><strong>${t('Episode Allowance')}</strong><p class="small-text">${state.demoAllowance.webtoon} ${t('Episodes')} left · ${state.demoRevision} included revisions</p><div class="progressbar"><div style="width:60%"></div></div><div class="subtle top-space">The number above is illustrative only. No real allowance is consumed in this prototype.</div></div></div></div>`}
function library(){const assets=[['Series Cover','Cover image','cover'],['Mina Reference','Character','character'],['Daniel Reference','Character','character'],['Office Location','Location','location'],['Ep. 3 Panel 01','Panel','panel'],['Ep. 3 Panel 02','Panel','panel'],['Story Reel Preview','Reel','reel'],['Episode Script','Text','text']];const shown=assets.filter(a=>state.libraryTab==='All'||a[1]===state.libraryTab);return `${phead('Library',state.uiLang==='id'?'Aset cerita, gambar referensi, naskah, dan media episode.':'Approved story assets, visual references, scripts and episode media.',b(`${I('upload',13)} Upload reference`,'upload-reference','btn-secondary'))}<div class="segmented" style="margin-bottom:14px;display:inline-flex">${['All','Cover image','Character','Location','Panel','Text'].map(x=>`<button class="${state.libraryTab===x?'active':''}" data-library-tab="${x}">${t(x)}</button>`).join('')}</div><div class="assets-grid">${shown.map((a,i)=>`<button class="asset" data-asset="${i}"><div class="assetthumb" style="background-position:${12+i*11}% center;filter:hue-rotate(${i*19}deg)"></div><div class="assetlabel"><strong>${esc(a[0])}</strong><span class="subtle">${t(a[1])} · ${t('Reference')}</span></div></button>`).join('')}</div><div class="info top-space">${I('shield',15)} Reference assets should retain provenance and ownership/usage-rights metadata. This prototype uses illustrative artwork; uploads are not stored on a server.</div>`}
function templates(){const arr=[['Campus Romance','romance','💗','Relationships · Slow-burn'],['Hidden Identity','mystery','🎭','Twists · Secrets'],['Fantasy Quest','fantasy','🪄','World-building · Adventure'],['Family Melodrama','family','🏠','Generational relationships'],['Revenge & Comeback','revenge','⚡','High-stakes short drama'],['Historical Romance','period','🏰','European Period / Regency'],['Haunted Village','horror','🌙','Mystery · Folklore'],['Workplace Sitcom','comedy','🎬','Comedy · Everyday']];return `${phead('Templates',state.uiLang==='id'?'Pilih titik awal, lalu personalisasi sesuai gaya kamu.':'Choose a starter concept, then personalize the story and style.')}<div class="templates-grid">${arr.map((a,i)=>`<button class="templatecard" data-idea="${a[1]}"><div class="template-image">${a[2]}</div><div class="templateinfo"><h3>${a[0]}</h3><p>${a[3]}</p><span class="inline-link">${t('Use template')} ${I('arrow',12)}</span></div></button>`).join('')}</div><div class="info top-space">Templates provide starting points, not standalone posts. Every project becomes a series with episodes and optional format adaptations.</div>`}
function exportView(){return `${phead('Export',state.uiLang==='id'?'Ekspor adaptasi yang sudah dibuat; unduhan ulang tidak mengurangi jatah episode.':'Download existing adaptations without consuming another episode allowance.')}<div class="export-grid"><div class="panel pad"><h3 class="section-label">1. Select content</h3><label class="field-wrap"><span class="field-label">${t('Series')}</span><select class="form-select" data-field="exportSeries"><option>${esc(state.seriesTitle)}</option></select></label><label class="field-wrap"><span class="field-label">${t('Format')}</span><select class="form-select" data-setting="selectedExportFormat">${Object.keys(fmtLabel).map(k=>`<option value="${k}" ${state.selectedExportFormat===k?'selected':''}>${t(fmtLabel[k])}</option>`).join('')}</select></label><div class="divider"></div><h3 class="section-label">2. ${t('Episodes')}</h3><div class="three-col">${[1,2,3,4,5,6].map(x=>`<label class="choice-row"><input type="checkbox" data-export-episode="${x}" ${state.exportEpisodes.includes(x)?'checked':''}> Ep. ${x}</label>`).join('')}</div><div class="divider"></div><h3 class="section-label">3. ${t('Production Settings')}</h3><div class="field-row">${settingPicker('exportQuality','Quality',['720p','1080p','Original text'])}<label class="field-wrap"><span class="field-label">File type</span><select class="form-select"><option>${state.selectedExportFormat==='text'?'TXT / PDF (concept)':'ZIP / MP4 / PNG (concept)'}</option></select></label></div><label class="choice-row top-space"><input type="checkbox" checked disabled> Apply series continuity metadata</label><div class="hstack wrap top-space">${b(`${I('download',14)} Download demo manifest`,'download-export','btn-primary')}${b(`${I('calendar',14)} ${t('Publish & Schedule')}`,'go-publish')}</div><div class="subtle top-space">Only a text manifest is downloaded in this offline demo. Real image/video export and packaging are not connected.</div></div><div class="panel pad"><h3 class="section-label">${t('Preview')}</h3><div class="preview-frame"><div><strong>${esc(state.seriesTitle)}</strong><div class="subtle" style="color:#eee5f4">${t(fmtLabel[state.selectedExportFormat])} · ${state.exportEpisodes.length} episode(s)</div></div></div><div class="top-space setting-list"><div class="setting-line"><span>${t('Series')}</span><strong class="value">${esc(state.seriesTitle)}</strong></div><div class="setting-line"><span>${t('Format')}</span><strong class="value">${t(fmtLabel[state.selectedExportFormat])}</strong></div><div class="setting-line"><span>Quality</span><strong class="value">${esc(state.exportQuality)}</strong></div><div class="setting-line"><span>Additional episode usage</span><strong class="value" style="color:#16846a">0</strong></div></div><div class="info top-space">Existing assets only. Creating a new format adaptation or regenerating media is a separate production action and requires its own allowance confirmation.</div></div></div>`}
function publish(){return `${phead('Publish & Schedule',state.uiLang==='id'?'Siapkan distribusi episode melalui Sociosight (alur konsep).':'Prepare episode releases via Sociosight (concept workflow only).')}<div class="export-grid"><div class="panel pad"><div class="row-between"><h3 class="section-label">${t('Channels')}</h3><span class="tag orange">Concept integration</span></div><div class="three-col">${['Instagram','TikTok','YouTube'].map(x=>`<label class="choice-row"><input type="checkbox" data-channel="${x}" ${state.publishChannels.includes(x)?'checked':''}>${x}</label>`).join('')}</div><div class="divider"></div><h3 class="section-label">${t('Caption')} & hashtags</h3><textarea id="publish-caption" class="form-area" rows="4">${esc(state.postCaption)}</textarea><div class="divider"></div><h3 class="section-label">${t('Schedule')}</h3><div class="field-row"><label class="field-wrap"><span class="field-label">Release date</span><input class="form-input" type="date" id="publish-date" value="${esc(state.publishDate)}"></label><label class="field-wrap"><span class="field-label">Time</span><input class="form-input" type="time" id="publish-time" value="${esc(state.publishTime)}"></label></div><p class="subtle">Demo timezone: Asia/Makassar (UTC+08:00). Final scheduling must support a selected timezone.</p><div class="hstack wrap top-space">${b(`${I('calendar',14)} Simulate Schedule`,'simulate-publish','btn-primary')}${b(`${I('download',14)} ${t('Export')}`,'go-export')}</div><p class="subtle top-space">Scheduling here only records a local demo item. No Social account is connected, no content is posted.</p></div><div class="panel pad"><h3 class="section-label">Release preview</h3><div class="preview-frame"><strong>Episode ${state.episode} · ${esc(state.seriesTitle)}</strong></div><div class="top-space"><div class="row-between"><h3 class="section-label">${t('Planned')} ${t('Schedule')}</h3><span class="tag weak">${state.scheduled.length} items</span></div>${state.scheduled.length?state.scheduled.map(s=>`<div class="scheduled"><div><strong>Episode ${s.episode}</strong><div class="subtle">${esc(s.date)} at ${esc(s.time)} (UTC+08) · ${s.channels.join(', ')}</div></div><span class="tag orange">Demo</span></div>`).join(''):'<div class="empty-state">No releases scheduled in this demo yet.</div>'}</div></div></div>`}
function billing(){const tabs=['Overview','Choose a Plan','Add Episodes','Add Revisions','History & Invoices'];return `${phead('Plan & Billing',state.uiLang==='id'?'Kapasitas produksi berdasarkan episode, bukan sistem credits umum.':'Understand your episode-based allowance, revisions and plan options.')}<div class="billing-hero"><div class="bot" style="width:44px;height:44px;flex-basis:44px">${I('layers',23)}</div><div style="flex:1"><strong style="font-size:15px">Episode-Based Plans</strong><p class="small-text" style="margin:5px 0 0">Predictable capacity by output format. Mock prices and quantities are placeholders—not approved commercial terms.</p></div><span class="tag">${t('Current Plan')} · Creator (demo)</span></div><div class="segmented" style="margin-bottom:14px;display:inline-flex;flex-wrap:wrap">${tabs.map(x=>`<button class="${state.billingTab===x?'active':''}" data-billing-tab="${x}">${t(x)}</button>`).join('')}</div>${state.billingTab==='Overview'?`<div class="usage-grid">${Object.entries(state.demoAllowance).map(([k,v])=>`<div class="panel pad"><div class="hstack">${I(fmtIcon[k],17)} <span class="text-sm">${t(fmtLabel[k])}</span></div><div class="metric" style="border:0;padding:0"><strong>${v}</strong><span>sample episodes remaining</span></div><div class="progressbar"><div style="width:${Math.max(12,Math.min(95,v*3))}%"></div></div></div>`).join('')}</div><div class="two-col top-space"><div class="panel pad"><h3 class="section-label">${t('My Plan')}</h3><div class="setting-list"><div class="setting-line"><span>Current tier</span><strong class="value">Creator (demo)</strong></div><div class="setting-line"><span>Included revisions</span><strong class="value">${state.demoRevision} per sample project</strong></div><div class="setting-line"><span>Renewal</span><strong class="value">Illustrative / TBD</strong></div><div class="setting-line"><span>Method</span><strong class="value">Not connected</strong></div></div>${b(t('Manage Subscription'),'subscription-modal','btn-secondary','style="margin-top:15px"')}</div><div class="panel pad"><h3 class="section-label">Add-ons</h3><div class="row-between"><div><strong style="font-size:12px">Extra episodes</strong><p class="small-text">Specify format before purchase.</p></div>${b(t('Add Episodes'),'go-addon')}</div><div class="divider"></div><div class="row-between"><div><strong style="font-size:12px">Extra AI revisions</strong><p class="small-text">Only if included revisions run out.</p></div>${b(t('Add Revisions'),'go-revisions')}</div></div></div>`:state.billingTab==='Choose a Plan'?`<div class="plan-grid">${[['Starter','$9','8 episodes / month'],['Creator','$19','20 episodes / month'],['Studio','$34','50 episodes / month']].map((p,i)=>`<div class="plan-card ${i===1?'featured':''}"><span class="tag ${i===1?'':'weak'}">${i===1?'Example current plan':'Concept only'}</span><h3>${p[0]}</h3><div class="price">${p[1]} <small>/month</small></div><p class="small-text">${p[2]} · format-specific production limits apply.</p>${b(i===1?'Selected (demo)':'Preview plan','plan-modal','btn-secondary','style="width:100%"')}</div>`).join('')}</div><p class="caution top-space">Package prices, format conversion rates, caps, trial conditions, renewals and actual charges have not been approved.</p>`:state.billingTab==='Add Episodes'||state.billingTab==='Add Revisions'?`<div class="panel pad" style="max-width:650px"><h3 class="section-label">${t(state.billingTab)}</h3><p class="small-text">Select a format and requested quantity. This demo only previews the flow; no real purchase is possible.</p>${settingPicker('selectedExportFormat','Format',Object.keys(fmtLabel))}<label class="field-wrap"><span class="field-label">Quantity</span><select id="addon-qty" class="form-select"><option>3</option><option>5</option><option>10</option></select></label><div class="info top-space">${t('No charge in this demo')}. A production purchase flow must show total price, billing period, validity and confirmation before charging.</div><div class="top-space">${b('Preview order','addon-modal','btn-primary')}</div></div>`:`<div class="panel pad"><h3 class="section-label">${t('History & Invoices')}</h3><table class="invoice-table"><thead><tr><th>Date</th><th>Description</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr><td>Nov 01, 2026</td><td>Creator Plan (illustrative)</td><td>$19.00</td><td><span class="tag green">Example</span></td></tr><tr><td>Oct 01, 2026</td><td>Creator Plan (illustrative)</td><td>$19.00</td><td><span class="tag green">Example</span></td></tr></tbody></table><p class="subtle top-space">No real invoice or payment data is loaded.</p></div>`}<div class="info top-space">${I('shield',15)} Episode production allowances, included revisions and downloads are separate. No 1:1 conversion across text, webtoon, video and reels is assumed.</div>`}
function help(){const faq=[['Can I write in Indonesian if my UI is English?','Yes. UI Language and story output language are separate. With Auto selected, Sandcastle is designed to respond and write the story in the language of your message.'],['Can I change storytelling styles later?','Yes. Changes to an approved series style should create a new Creative Direction revision. Existing episodes are not automatically regenerated.'],['Is every story format a series?','Yes. Text, Webtoon, Short Drama, and Story Reels are always organized as series and episodes. One source story may have several adaptations.'],['Do exports consume another episode?','Downloading previously produced assets should not consume another episode allowance. New format adaptations or regenerations are separate actions.'],['What does the audience rating control?','All Ages, Teen 13+, Young Adult 16+, and Mature 18+ classify content boundaries. Mature is not a license to generate prohibited content.'],['Can I publish to social media?','A planned Sociosight integration is shown in the prototype. Real account connection, eligibility and platform restrictions must be implemented and validated.'],['Does the prototype call AI or process real billing?','No. This is an interactive product-design prototype. The language detection, replies, styles, plan values, and exports illustrate the intended workflow.']];return `${phead('Help & Guide',state.uiLang==='id'?'Petunjuk cepat dan pertanyaan yang sering muncul.':'Product concepts and frequently asked questions.')}<div class="two-col"><div class="panel pad"><h3 class="section-label">Quick start</h3><div class="story-beats"><div class="beat"><span class="beatno">1</span><div><strong>Describe a series idea</strong><br>Write in any language; choose a first format.</div></div><div class="beat"><span class="beatno">2</span><div><strong>Accept a storytelling style</strong><br>Review AI Recommended or browse regional styles.</div></div><div class="beat"><span class="beatno">3</span><div><strong>Build story & characters</strong><br>Approve Story DNA and Creative Direction.</div></div><div class="beat"><span class="beatno">4</span><div><strong>Review episodes</strong><br>Preview, revise and export approved outputs.</div></div></div>${b(`${I('plus',13)} ${t('Create Series')}`,'go-home','btn-primary')}</div><div class="panel pad">${langBanner()}<div class="divider"></div><h3 class="section-label">Useful product terms</h3><div class="setting-list"><div class="setting-line"><span>Story DNA</span><strong class="value">Genre · Trope · Audience</strong></div><div class="setting-line"><span>Storytelling Style</span><strong class="value">Narrative conventions</strong></div><div class="setting-line"><span>Visual Style</span><strong class="value">Image / video aesthetics</strong></div><div class="setting-line"><span>Creative Direction Bible</span><strong class="value">Series-level source of truth</strong></div></div>${b(`${I('spark',13)} ${t('Browse all styles')}`,'open-styles','btn-secondary','style="margin-top:18px"')}</div></div><div class="top-space"><h3 class="section-label">Frequently asked questions</h3><div class="two-col">${faq.map((q,i)=>`<details class="card" style="padding:15px"><summary style="cursor:pointer;font-size:12px;font-weight:800">${q[0]}</summary><p class="small-text">${q[1]}</p></details>`).join('')}</div></div>`}
function settings(){return `${phead('Settings',state.uiLang==='id'?'Atur bahasa antarmuka, bahasa cerita, dan preferensi.':'Personalize the interface language independently of your story language.')}<div class="two-col"><div class="panel pad"><h3 class="section-label">${I('globe',16)} ${t('Language')}</h3><label class="field-wrap"><span class="field-label">${t('UI Language')}</span><select class="form-select" data-setting="uiLang"><option value="en" ${state.uiLang==='en'?'selected':''}>English</option><option value="id" ${state.uiLang==='id'?'selected':''}>Bahasa Indonesia</option></select></label><p class="subtle">${state.uiLang==='id'?'Ini hanya mengubah tombol, menu, dan label antarmuka.':'Changes menu labels, navigation and UI copy—not the language of your story.'}</p><div class="divider"></div><label class="field-wrap"><span class="field-label">${t('Output Language')}</span><select class="form-select" data-setting="storyLang">${['auto','en','id','es','fr','th','hi','ar','ja','ko'].map(x=>`<option value="${x}" ${state.storyLang===x?'selected':''}>${langName(x)}</option>`).join('')}</select></label><p class="subtle">${state.uiLang==='id'?'Auto mengikuti bahasa pesan yang kamu kirim. Kamu bisa mengunci bahasa hasil cerita agar tetap konsisten.':'Auto matches the language of each creator message. Lock a language if you want all story production in one language.'}</p>${langBanner()}</div><div class="panel pad"><h3 class="section-label">${I('settings',16)} ${t('Profile')}</h3><div class="hstack"><span class="avatar">S</span><div><strong>Sandcastle Creator</strong><div class="subtle">Demo profile · no account connection</div></div></div><div class="divider"></div><h3 class="section-label">Prototype preferences</h3><label class="choice-row"><input type="checkbox" checked> Show AI creative recommendations</label><label class="choice-row top-space"><input type="checkbox" checked> Confirm before episode allowance usage</label><div class="divider"></div><h3 class="section-label">Demo data</h3><p class="small-text">Your choices in this HTML prototype are saved only to this browser if local storage is available.</p>${b('Reset prototype to sample data','reset-demo','btn-secondary')}<div class="divider"></div><span class="tag orange">Prototype only</span><p class="subtle">Other UI localizations would need a localization and quality review before launch.</p></div></div>`}
function styleDrawer(){let q=state.styleQuery.toLowerCase();const items=STYLES.filter(x=>(state.styleRegion==='All'||state.styleRegion===x.region)&&(`${x.name} ${x.region} ${x.desc}`.toLowerCase().includes(q)));const s=STYLES.find(x=>x.id===state.draftStyle)||STYLES[0];const label=state.previewTab==='narrative'?'Narrative':state.previewTab==='image'?'Image Direction':'Video Direction';return `<div class="backdrop" data-act="close-overlay"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="style-dialog-title"><div class="drawer-head"><div class="row-between"><h2 id="style-dialog-title">${I('spark',19)} ${t('Choose Storytelling Style')}</h2><button class="closex" data-act="close-overlay" aria-label="Close">×</button></div><p>${state.uiLang==='id'?'AI menyarankan style dari premismu. Kamu dapat mencari gaya lain tanpa keluar dari workspace.':'AI suggests styles from your premise. Explore alternatives without leaving your workspace.'}</p><div class="search top-space">${I('search',17)}<input id="style-query" value="${esc(state.styleQuery)}" placeholder="${t('Search styles, regions or moods…')}"></div><div class="regionline">${REGIONS.map(x=>`<button class="region ${state.styleRegion===x?'active':''}" data-region="${esc(x)}">${x==='All'?t('All'):x}</button>`).join('')}</div></div><div class="drawer-body"><div class="cap">${t('AI recommendations for this story')}</div><div class="hstack wrap" style="margin:10px 0 15px">${['korean','thai','turkish'].map(k=>{let z=STYLES.find(s=>s.id===k);return `<button class="tag ${state.draftStyle===k?'':'weak'}" data-draft-style="${k}">${z.name}</button>`}).join('')}</div><div class="row-between"><h3 class="section-label">${t('Browse Styles')}</h3><span class="subtle">${items.length} styles</span></div><div class="style-results">${items.length?items.map(x=>`<button class="styleentry ${state.draftStyle===x.id?'active':''}" data-draft-style="${x.id}"><span class="thumb" style="background:linear-gradient(140deg,${x.colors[0]},${x.colors[1]})">${esc(x.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</span><span style="flex:1;min-width:0"><strong style="font-size:11px">${esc(x.name)}</strong><small class="subtle" style="display:block;margin-top:5px;line-height:1.4">${esc(x.desc)}</small></span><span class="radio-ring">${state.draftStyle===x.id?'✓':''}</span></button>`).join(''):'<div class="empty-state">No matching presets. Clear the search or choose another region.</div>'}</div><div class="divider"></div><div class="row-between"><h3 class="section-label" style="margin:0">${t('Style Preview')}</h3><span class="tag weak">Text-only · no video cost</span></div><div class="previewtabs">${[['narrative','Narrative'],['image','Image Direction'],['video','Video Direction']].map(a=>`<button class="${state.previewTab===a[0]?'active':''}" data-style-preview="${a[0]}">${t(a[1])}</button>`).join('')}</div><div class="style-preview"><strong>${esc(s.name)}</strong><p>${esc(s[state.previewTab])}</p><div class="subtle">Illustrative direction. Real generation quality requires testing.</div></div><div class="info top-space">Style affects script, images, and video direction. Cultural setting, era, visuals and dialogue language remain independent choices.</div></div><div class="drawer-foot"><span class="subtle">${t('Creative Direction')} · ${t('Series')}</span>${b(`${t('Use This Style')} ${I('arrow',13)}`,'apply-style','btn-primary')}</div></aside></div>`}
function modal(title,body,foot){return `<div class="modalback" data-act="close-overlay"><div class="modal" role="dialog" aria-modal="true"><div class="row-between"><h2>${title}</h2><button class="closex" data-act="close-overlay">×</button></div>${body}<div class="modal-footer">${b(t('Cancel'),'close-overlay')}${foot}</div></div></div>`}
function renderModal(){const m=state.modal;if(!m)return '';if(m==='character'||m?.type==='edit-character'){const c=m?.type==='edit-character'?(state.characters||[]).find(x=>x.id===m.id):null;return modal(c?'Edit Character':t('New Character'),`<p>Characters become reusable entries in the Series Bible for future episodes and adaptations.</p><label class="field-wrap"><span class="field-label">Name</span><input id="character-name" class="form-input" value="${esc(c?.name||'')}"></label><label class="field-wrap"><span class="field-label">Role</span><select id="character-role" class="form-select">${['Protagonist','Love Interest','Supporting','Antagonist'].map(x=>`<option ${c?.role===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field-wrap"><span class="field-label">Personality / character arc</span><textarea id="character-trait" class="form-area">${esc(c?.trait||'')}</textarea></label><label class="field-wrap"><span class="field-label">Appearance / reference notes</span><input id="character-appearance" class="form-input" value="${esc(c?.appearance||'')}"></label>`,b(t('Save'),'save-character','btn-primary'))}
if(m==='world')return modal(t('Add Note'),`<p>Record story-world facts. The continuity validator should compare new episodes with these approved notes.</p><label class="field-wrap"><span class="field-label">Category</span><select id="world-type" class="form-select"><option>Canon</option><option>Location</option><option>Relationship</option><option>Timeline</option></select></label><label class="field-wrap"><span class="field-label">Title</span><input id="world-title" class="form-input" placeholder="The family secret"></label><label class="field-wrap"><span class="field-label">Note</span><textarea id="world-body" class="form-area"></textarea></label>`,b(t('Save'),'save-world','btn-primary'));
if(m==='adaptation')return modal(t('Create Adaptation'),`<p>Create another output format from the same story concept while preserving Story DNA. A new adaptation requires new format-specific production allowance.</p><label class="field-wrap"><span class="field-label">Target format</span><select id="adaptation-format" class="form-select">${Object.keys(fmtLabel).map(k=>`<option value="${k}">${t(fmtLabel[k])}</option>`).join('')}</select></label><div class="info">The demo opens the appropriate editor but does not generate content or use real episode allowance.</div>`,b(t('Continue'),'create-adaptation','btn-primary'));
if(m==='generate'||m==='revise')return modal(m==='generate'?'Generate Episode Preview':'Revise Episode',`<div class="hstack"><span class="style-icon">${I('spark',18)}</span><div><strong>${esc(style().name)}</strong><div class="subtle">Episode ${state.episode} · ${state.editorTab} · ${esc(state.audience)}</div></div></div><p>In production, Sandcastle would verify generation scope, allowance, selected format, and continuity before invoking the media engine.</p><div class="caution">${m==='revise'?'Would use 1 included revision, subject to policy.':'Would use the applicable episode allowance if confirmed.'} This prototype does NOT call AI and does not consume an actual allowance.</div>`,b('Simulate Preview','confirm-preview','btn-primary'));
if(m==='feedback')return modal(t('Send Feedback'),`<p>Help improve Sandcastle after each generation. Rate the experience and optionally share suggestions.</p><div class="field-label">Overall experience</div><div class="ratingrow">${[1,2,3,4,5].map(n=>`<button class="${state.activeFeedback>=n?'on':''}" data-rating="${n}" aria-label="Rate ${n}">★</button>`).join('')}</div><label class="field-wrap"><span class="field-label">Suggestions (optional)</span><textarea id="feedback-comment" class="form-area" placeholder="What worked? What could be better?"></textarea></label>`,b(t('Send Feedback'),'save-feedback','btn-primary'));
if(m==='addon'||m==='plan'||m==='subscription')return modal(m==='subscription'?t('Manage Subscription'):'Billing Preview',`<p>This screen illustrates the billing flow. Plan values, add-ons, validity and charging rules require business validation.</p><div class="caution">${t('No charge in this demo')}. No payment method will be collected.</div>`,b('Got it','close-overlay','btn-primary'));
if(m==='continuity')return modal('Continuity Review',`<p>The future validator should check approved characters, story events, settings, style guidance and audience constraints before content is finalized.</p><div class="info">UI status icons are illustrative, not evidence of validated production continuity scores.</div>`,b(t('Close'),'close-overlay','btn-primary'));
if(m==='asset')return modal('Asset Details',`<img src="${ART}" style="width:100%;height:210px;object-fit:cover;border-radius:12px" alt="Reference artwork"><p>Illustrative studio asset. Real library items would show version, owner, permissions, approved character/world relationships, and related episodes.</p>`,b(t('Close'),'close-overlay','btn-primary'));
if(m==='upload')return modal('Upload Reference',`<p>This is a prototype. Uploads are intentionally unavailable: reference assets need secure server-side validation and ownership metadata.</p><div class="info">For Sandcastle development, support JPEG/PNG/WebP, size limits, and approved asset reference workflows.</div>`,b(t('Close'),'close-overlay','btn-primary'));
if(m==='reset')return modal('Reset prototype?',`<p>Restore the default sample series, creative preferences, notes, and local feedback. This only affects local prototype state in your browser.</p>`,b('Reset demo','confirm-reset','btn-primary'));
return modal('Prototype',`<p>${t('No AI generation or payment is performed in this prototype.')}</p>`,b(t('Close'),'close-overlay','btn-primary'))}
function render(){document.documentElement.lang=state.uiLang==='id'?'id':'en';const view={home,series,workspace,editor,characters,world,library,templates,export:exportView,publish,billing,help,settings}[state.route]||home;document.getElementById('app').innerHTML=chrome(view());document.getElementById('overlay-root').innerHTML=state.modal?renderModal():state.drawer?styleDrawer():'';}
function guessStyle(txt){const x=txt.toLowerCase();if(/india|bollywood|hindi/.test(x))return 'bollywood';if(/thai|lakorn|thailand/.test(x))return 'thai';if(/turk|ottoman/.test(x))return 'turkish';if(/regency|victorian|period|european|historical europe/.test(x))return 'europe';if(/thriller|crime|investigation|detektif/.test(x))return 'nordic';if(/anime|fantasy|quest|dunia fantasi/.test(x))return 'japanese';if(/revenge|ceo|billionaire|hidden identity/.test(x))return 'chinese';return 'korean'}
function applyIdea(p){const dict={romance:'A shy student and a popular campus leader grow closer after a secret encounter.',fantasy:'An heir discovers a hidden kingdom, but must choose between family and a new world.',mystery:'A journalist uncovers a family secret while investigating a missing person.',family:'Three generations of one family discover that a long-hidden letter changes their inheritance.',revenge:'A woman rebuilds her life after betrayal and returns to confront the company that ruined her.',period:'A young aristocrat refuses a family-arranged marriage during the Regency era.',horror:'A coastal village hides a secret that returns every year during monsoon season.',comedy:'Colleagues at a small agency try to solve everyday chaos with unexpected results.'};state.storyIdea=dict[p]||dict.romance;state.styleId=guessStyle(state.storyIdea);state.styleApplied=false;state.selectedFormat=p==='revenge'?'short':'webtoon';chooseRoute('home');toast('Template selected. Adjust the premise before creating a series.');}
function createSeries(){const el=document.getElementById('home-idea');const v=(el?.value||state.storyIdea||'').trim();if(v.length<8){toast(state.uiLang==='id'?'Tuliskan ide singkat terlebih dahulu.':'Please enter a short story idea first.');return;}state.storyIdea=v;state.lastMessageLang=detectLanguage(v);if(!state.styleApplied)state.styleId=guessStyle(v);state.draftStyle=state.styleId;state.seriesTitle=v.toLowerCase().includes('ceo')?'My CEO, My Contract':(v.length>50?v.slice(0,46).trim()+'…':v);state.messages=[{role:'user',lang:state.lastMessageLang,text:v}];state.messages.push({role:'assistant',lang:state.lastMessageLang,text:state.lastMessageLang==='id'?'Ide cerita sudah diterima! Mari tentukan genre, karakter, dan gaya bercerita sebelum membuat episode.':'I have your story idea! Let’s refine the characters, outline, and storytelling style before producing episodes.'});state.selectedSeries='new';state.customSeries=(state.customSeries||[]).filter(s=>s.id!=='new');state.customSeries.unshift({id:'new',name:state.seriesTitle,genre:state.primaryGenre+' · Drama',status:'Draft',progress:0,episodes:0,total:30,style:state.styleId,format:state.selectedFormat,cover:1});chooseRoute('workspace');toast('Series workspace created locally · Demo');}
function closeOverlay(){state.modal=null;state.drawer=false;save();render();}
function actionClick(act){switch(act){
case 'toggle-nav':state.mobileNav=!state.mobileNav;render();break;
case 'lang-menu':state.langOpen=!state.langOpen;render();break;
case 'go-home':chooseRoute('home');break;
case 'go-workspace':chooseRoute('workspace');break;
case 'go-editor':chooseRoute('editor');break;
case 'go-export':chooseRoute('export');break;
case 'go-publish':chooseRoute('publish');break;
case 'go-addon':state.billingTab='Add Episodes';chooseRoute('billing');break;
case 'go-revisions':state.billingTab='Add Revisions';chooseRoute('billing');break;
case 'create-series':createSeries();break;
case 'open-styles':state.draftStyle=state.styleId;state.drawer=true;state.modal=null;state.styleQuery='';state.styleRegion='All';state.previewTab='narrative';render();setTimeout(()=>document.querySelector('#style-query')?.focus(),20);break;
case 'close-overlay':closeOverlay();break;
case 'toggle-advanced':state.advanced=!state.advanced;save();render();break;
case 'apply-style':state.styleId=state.draftStyle;state.styleApplied=true;state.drawer=false;save();render();toast('Creative Direction updated · '+style().name);break;
case 'send-chat':{const val=document.querySelector('#chat-input')?.value||'';chatReply(val);break}
case 'new-character':state.modal='character';render();break;
case 'save-character':{const name=document.querySelector('#character-name')?.value.trim(),role=document.querySelector('#character-role')?.value,trait=document.querySelector('#character-trait')?.value.trim(),appearance=document.querySelector('#character-appearance')?.value.trim();if(!name){toast('Please enter a character name');return;}const id=state.modal?.type==='edit-character'?state.modal.id:'c'+Date.now();state.characters=state.characters||[];const found=state.characters.findIndex(x=>x.id===id);const row={id,name,role,trait:trait||'To be developed',appearance:appearance||'Reference to be approved',avatar:found>=0?state.characters[found].avatar:'av4'};if(found>=0)state.characters[found]=row;else state.characters.push(row);state.modal=null;save();render();toast('Character saved locally');break}
case 'add-world':state.modal='world';render();break;
case 'save-world':{const title=document.querySelector('#world-title')?.value.trim();if(!title){toast('Please enter a title');return;}state.worldNotes.push({id:'w'+Date.now(),type:document.querySelector('#world-type').value,title,body:document.querySelector('#world-body').value.trim()});state.modal=null;save();render();toast('World note saved');break}
case 'adaptation-modal':state.modal='adaptation';render();break;
case 'create-adaptation':state.selectedFormat=document.querySelector('#adaptation-format')?.value||'webtoon';state.editorTab=state.selectedFormat==='text'?'script':state.selectedFormat;state.modal=null;chooseRoute('editor');toast('Adaptation draft opened · No media generated');break;
case 'new-episode':state.episode=Math.min(40,state.episode+1);chooseRoute('editor');toast('New episode draft opened · Demo');break;
case 'generate-preview':state.modal='generate';render();break;
case 'revise-preview':state.modal='revise';render();break;
case 'confirm-preview':{let prev=state.modal;state.modal=null;save();render();toast(prev==='revise'?'Revision preview simulated; no AI call or charge.':'Generation preview simulated; no AI call or charge.');break}
case 'save-draft':save();toast('Episode draft saved locally · Demo');break;
case 'continuity-details':state.modal='continuity';render();break;
case 'feedback':state.activeFeedback=0;state.modal='feedback';render();break;
case 'save-feedback':{if(!state.activeFeedback){toast('Please select a rating');return;}state.feedback.push({rating:state.activeFeedback,comment:document.querySelector('#feedback-comment')?.value||'',createdAt:new Date().toISOString()});state.modal=null;save();render();toast('Thanks! Prototype feedback saved in this browser.');break}
case 'upload-reference':state.modal='upload';render();break;
case 'download-export':{const lines=['SANDCASTLE STUDIO — DEMO EXPORT MANIFEST','Prototype only: no generated image/video media is included.','',`Series: ${state.seriesTitle}`,`Format: ${fmtLabel[state.selectedExportFormat]}`,`Episodes: ${state.exportEpisodes.join(', ')}`,`Quality: ${state.exportQuality}`,`Storytelling Style: ${style().name}`,`Visual Style: ${state.visualStyle}`,`Audience: ${state.audience}`,'','Story premise:',state.storyIdea,'','This is not a commercial export or AI-produced episode.'];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Sandcastle_Demo_Export_Manifest.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Downloaded a local demo text manifest (no media).');break}
case 'simulate-publish':{const cap=document.querySelector('#publish-caption');const date=document.querySelector('#publish-date');const time=document.querySelector('#publish-time');state.postCaption=cap?.value||'';state.publishDate=date?.value||'';state.publishTime=time?.value||'';if(!state.publishDate||!state.publishTime||!state.publishChannels.length){toast('Choose at least one channel and a valid date/time');return;}state.scheduled.unshift({date:state.publishDate,time:state.publishTime,channels:[...state.publishChannels],episode:state.episode,caption:state.postCaption});save();render();toast('Release added to local demo schedule · Nothing posted');break}
case 'subscription-modal':state.modal='subscription';render();break;
case 'plan-modal':state.modal='plan';render();break;
case 'addon-modal':state.modal='addon';render();break;
case 'reset-demo':state.modal='reset';render();break;
case 'confirm-reset':try{localStorage.removeItem('sandcastle_full_prototype_v1')}catch(e){}state=structuredClone(firstState);render();toast('Prototype restored to sample data');break;
default:toast('This is a local product prototype.');
}}
function handleClick(e){const el=e.target.closest('[data-act],[data-nav],[data-format],[data-idea],[data-mode],[data-series],[data-filter],[data-episode],[data-editor-tab],[data-library-tab],[data-billing-tab],[data-draft-style],[data-region],[data-style-preview],[data-edit-character],[data-asset],[data-rating],[data-adaptation],[data-lang],[data-suggest]');if(!el)return;
if(el.dataset.act==='close-overlay'&&el!==e.target&&(el.classList.contains('backdrop')||el.classList.contains('modalback')))return;
if(el.dataset.lang){state.uiLang=el.dataset.lang;state.langOpen=false;save();render();toast(state.uiLang==='id'?'Bahasa antarmuka diubah ke Indonesia.':'UI language changed to English.');return}
if(el.dataset.nav){chooseRoute(el.dataset.nav);return}
if(el.dataset.format){state.selectedFormat=el.dataset.format;save();render();return}
if(el.dataset.idea){applyIdea(el.dataset.idea);return}
if(el.dataset.mode){state.workspaceMode=el.dataset.mode;save();render();return}
if(el.dataset.series){const s=[...(state.customSeries||[]),...sampleSeries].find(x=>x.id===el.dataset.series);if(s){state.selectedSeries=s.id;state.seriesTitle=s.name;state.styleId=s.style;state.styleApplied=true;state.selectedFormat=s.format;}chooseRoute('workspace');return}
if(el.dataset.filter){state.seriesFilter=el.dataset.filter;save();render();return}
if(el.dataset.episode){state.episode=Number(el.dataset.episode);save();render();return}
if(el.dataset.editorTab){state.editorTab=el.dataset.editorTab;save();render();return}
if(el.dataset.libraryTab){state.libraryTab=el.dataset.libraryTab;save();render();return}
if(el.dataset.billingTab){state.billingTab=el.dataset.billingTab;save();render();return}
if(el.dataset.draftStyle){state.draftStyle=el.dataset.draftStyle;document.getElementById('overlay-root').innerHTML=styleDrawer();return}
if(el.dataset.region){state.styleRegion=el.dataset.region;document.getElementById('overlay-root').innerHTML=styleDrawer();return}
if(el.dataset.stylePreview){state.previewTab=el.dataset.stylePreview;document.getElementById('overlay-root').innerHTML=styleDrawer();return}
if(el.dataset.editCharacter){state.modal={type:'edit-character',id:el.dataset.editCharacter};render();return}
if(el.dataset.asset){state.modal='asset';render();return}
if(el.dataset.rating){state.activeFeedback=Number(el.dataset.rating);document.getElementById('overlay-root').innerHTML=renderModal();return}
if(el.dataset.adaptation){state.selectedFormat=el.dataset.adaptation;state.editorTab=el.dataset.adaptation==='text'?'script':el.dataset.adaptation;chooseRoute('editor');return}
if(el.dataset.suggest){const r={premise:'Let’s develop the premise and identify the main conflict.',characters:'Help me develop two characters and their relationship.',outline:'Let’s plan the main beats of the first 10 episodes.'};chatReply(r[el.dataset.suggest]);return}
if(el.dataset.act)actionClick(el.dataset.act);
}
document.addEventListener('click',handleClick);
document.addEventListener('input',e=>{if(e.target.id==='home-idea')state.storyIdea=e.target.value;if(e.target.id==='series-search'){state.seriesSearch=e.target.value;const target=document.querySelector('.series-grid');if(target){const tmp=document.createElement('div');tmp.innerHTML=seriesCards();target.replaceWith(tmp.firstElementChild);}}if(e.target.id==='style-query'){state.styleQuery=e.target.value;const start=e.target.selectionStart;document.getElementById('overlay-root').innerHTML=styleDrawer();const x=document.querySelector('#style-query');if(x){x.focus();x.setSelectionRange(start,start);}}});
document.addEventListener('change',e=>{if(e.target.dataset.setting){const k=e.target.dataset.setting;state[k]=e.target.value;save();render();if(k==='uiLang')toast(state.uiLang==='id'?'Bahasa UI berubah · Bahasa cerita tidak berubah.':'UI language updated; story language remains independent.');return}if(e.target.dataset.exportEpisode){const x=Number(e.target.dataset.exportEpisode);if(e.target.checked&&!state.exportEpisodes.includes(x))state.exportEpisodes.push(x);if(!e.target.checked)state.exportEpisodes=state.exportEpisodes.filter(a=>a!==x);save();render();return}if(e.target.dataset.channel){const ch=e.target.dataset.channel;if(e.target.checked&&!state.publishChannels.includes(ch))state.publishChannels.push(ch);if(!e.target.checked)state.publishChannels=state.publishChannels.filter(x=>x!==ch);save();render();return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.modal||state.drawer||state.langOpen)){state.modal=null;state.drawer=false;state.langOpen=false;render();return}if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatReply(e.target.value)}if(e.target.id==='series-search'&&e.key==='Enter')e.preventDefault();});
render();
</script>
</body></html>
